<style>
:root{--bg:#f8fafc;--surface:#fff;--ink:#1e293b;--soft:#64748b;--line:#e2e8f0;--primary:#3b82f6;--deep:#1e40af;--psoft:#eaf2ff;--accent:#8b5cf6;--asoft:#f3eeff;--ok:#10b981;--oksoft:#e6f7ef;--warn:#f59e0b;--wsoft:#fff7db;--bad:#ef4444;--badsoft:#fdecec;--orange:#ea580c;--ease:cubic-bezier(.22,.61,.36,1)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.7;
background-image:radial-gradient(circle at 8% 6%,rgba(59,130,246,.09),transparent 38%),radial-gradient(circle at 94% 92%,rgba(139,92,246,.09),transparent 38%);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
:focus-visible{outline:3px solid rgba(59,130,246,.45);outline-offset:2px}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top>div{max-width:860px;margin:auto;padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;gap:1rem}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:900;font-size:1.15rem}
.brand i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:1rem}
.back{font-size:.85rem;font-weight:700;color:var(--soft);display:flex;align-items:center;gap:.4rem;padding:.4rem .8rem;border-radius:10px;transition:background .2s}
.back:hover{background:var(--psoft);color:var(--deep)}
.tools{display:flex;align-items:center;gap:.3rem}

main{max-width:760px;margin:0 auto;padding:1.6rem 1rem 3rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:0 20px 50px rgba(15,23,42,.07);padding:2rem 1.6rem;text-align:center}
.in{animation:rise .45s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero{width:92px;height:92px;border-radius:28px;margin:0 auto 1.1rem;background:linear-gradient(135deg,var(--warn),var(--orange));color:#fff;font-size:2.4rem;display:flex;align-items:center;justify-content:center;box-shadow:0 14px 28px rgba(234,88,12,.28)}
h1{font-size:clamp(1.5rem,4.5vw,2.1rem);font-weight:900;line-height:1.5;margin-bottom:.4rem}
.sub{color:var(--soft);margin-bottom:1.2rem}
.stats{display:flex;justify-content:center;gap:.7rem;flex-wrap:wrap;margin-bottom:1.2rem}
.stats span{background:var(--asoft);color:var(--accent);font-weight:800;font-size:.85rem;padding:.35rem .9rem;border-radius:999px}
.box{text-align:right;border-radius:16px;padding:1rem 1.2rem;font-size:.93rem;line-height:2;margin-bottom:1rem}
.box.blue{background:var(--psoft)}
.box.dash{background:var(--bg);border:1px dashed var(--line)}
.box small{color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6rem;border:none;border-radius:14px;padding:.9rem 2rem;font-weight:800;font-size:1rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--primary),var(--accent));box-shadow:0 10px 20px rgba(59,130,246,.25);transition:transform .2s var(--ease),box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 26px rgba(59,130,246,.32)}
.btn.ghost{background:var(--psoft);color:var(--deep);box-shadow:none}
.btn.green{background:linear-gradient(135deg,var(--ok),#047857);box-shadow:0 10px 20px rgba(16,185,129,.25)}
.btn.white{background:#fff;color:var(--deep);box-shadow:none}
.acts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:700;color:var(--soft);margin-bottom:.6rem}
.chip{background:var(--asoft);color:var(--accent);padding:.25rem .9rem;border-radius:999px}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:1.8rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;transition:width .4s var(--ease)}
.q{font-size:clamp(1.15rem,3.6vw,1.45rem);font-weight:800;line-height:1.9;min-height:7rem;display:flex;align-items:center;justify-content:center;margin-bottom:1.4rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.2rem}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:1.1rem .6rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.25rem;transition:all .2s var(--ease)}
.opt i{font-size:1.8rem}.opt b{font-size:1.2rem}.opt small{color:var(--soft);font-size:.78rem;line-height:1.5}
.opt.yes i{color:var(--ok)}.opt.no i{color:var(--bad)}
.opt.yes:hover,.opt.yes.sel{border-color:var(--ok);background:var(--oksoft);transform:translateY(-3px)}
.opt.no:hover,.opt.no.sel{border-color:var(--bad);background:var(--badsoft);transform:translateY(-3px)}
.prev{background:none;border:none;color:var(--soft);font-weight:700;font-size:.9rem;cursor:pointer;padding:.4rem .8rem}
.prev:disabled{opacity:.35;cursor:default}
.foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.restart:hover{color:var(--bad)}
.hint{font-size:.75rem;color:var(--soft);margin-top:.4rem}
.gauge{position:relative;width:190px;height:190px;margin:.2rem auto .8rem}
.gauge svg{transform:rotate(-90deg)}
.gauge .bg{stroke:var(--line)}.gauge .fg{transition:stroke-dashoffset 1.2s var(--ease)}
.gauge div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge strong{font-size:2.6rem;font-weight:900;line-height:1}
.gauge span{font-size:.85rem;color:var(--soft);margin-top:.3rem}
.tier{display:inline-block;padding:.4rem 1.3rem;border-radius:999px;font-weight:900;font-size:1.15rem;margin-bottom:.4rem}
.rng{font-size:.8rem;color:var(--soft);margin-bottom:.6rem}
.desc{color:var(--soft);line-height:1.95;margin-bottom:1.4rem}
.axes{text-align:right;margin-bottom:1.2rem}
.axis{margin-bottom:.8rem;font-size:.85rem;font-weight:700}
.axis div{display:flex;justify-content:space-between;margin-bottom:.25rem}
.axis i{display:block;height:9px;border-radius:999px;background:var(--line);overflow:hidden}
.axis b{display:block;height:100%;width:0;border-radius:999px;transition:width .9s var(--ease)}
.note{font-size:.8rem;color:var(--soft);background:var(--bg);border-radius:12px;padding:.7rem 1rem;margin-bottom:1.3rem}
.sol{text-align:right}
.sol .lead{text-align:center;color:var(--soft);margin-bottom:1.3rem}
.sc{border:1px solid var(--line);border-radius:18px;padding:1.2rem;margin-bottom:1rem}
.sc.weak{border-color:var(--warn);background:var(--wsoft)}
.sh{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.2rem}
.sh h3{font-size:1.05rem;font-weight:800;color:var(--deep)}
.badge{font-size:.75rem;font-weight:800;padding:.2rem .7rem;border-radius:999px;background:var(--oksoft);color:var(--ok)}
.weak .badge{background:var(--warn);color:#fff}
.sr{font-size:.8rem;color:var(--accent);font-weight:700;margin-bottom:.5rem}
.sp{font-size:.9rem;font-weight:700;margin-bottom:.6rem}
.sc ul{list-style:none;margin-bottom:.7rem}
.sc li{font-size:.86rem;color:var(--soft);padding:.15rem 0;display:flex;gap:.5rem}
.sc li::before{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;color:var(--ok);font-size:.72rem;margin-top:.35rem}
.ss{font-size:.88rem;background:var(--oksoft);border-radius:12px;padding:.7rem 1rem}
.cta{background:linear-gradient(135deg,var(--deep),var(--accent));color:#fff;border-radius:20px;padding:1.6rem 1.2rem;text-align:center;margin:1.4rem 0 1rem}
.cta h3{font-size:1.4rem;font-weight:900;margin-bottom:.5rem}
.cta p{font-size:.93rem;line-height:1.9;margin-bottom:.4rem}
.cta .acts{margin-top:.9rem}
.dlg{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:opacity .22s var(--ease),visibility 0s linear .22s}
.dlg.open{opacity:1;visibility:visible;transition:opacity .22s var(--ease)}
.dlg-box{width:100%;max-width:400px;background:var(--surface);border-radius:24px;padding:1.8rem 1.5rem 1.4rem;text-align:center;box-shadow:0 30px 70px rgba(15,23,42,.3);transform:translateY(16px) scale(.94);transition:transform .3s cubic-bezier(.34,1.4,.64,1)}
.dlg.open .dlg-box{transform:none}
.dlg-ico{width:70px;height:70px;border-radius:50%;margin:0 auto 1rem;background:var(--wsoft);color:var(--warn);font-size:1.9rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px rgba(245,158,11,.12)}
.dlg h3{font-size:1.2rem;font-weight:900;line-height:1.7;margin-bottom:.3rem}
.dlg p{color:var(--soft);font-size:.95rem;margin-bottom:1.4rem}
.dlg-acts{display:flex;flex-direction:column;gap:.6rem}
.dlg-acts .btn{width:100%;padding:.8rem 1rem}
.btn.danger{background:linear-gradient(135deg,#f97316,var(--bad));box-shadow:0 10px 20px rgba(239,68,68,.25)}
footer{text-align:center;color:var(--soft);font-size:.8rem;padding:0 1rem 2rem}
@media(max-width:520px){.card{padding:1.5rem 1rem;border-radius:22px}.btn{width:100%}.back{font-size:.78rem;padding:.4rem .5rem}.brand{font-size:1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>

    open:()=>seq([523,784],.07,.18,'sine',.12),
    close:()=>seq([784,523],.07,.16,'sine',.1),
    yes:()=>seq([659,988],.07,.2,'triangle',.16),
    no:()=>tone(220,0,.18,'sine',.1),

      else if(t===2)seq([523,659,784],.14,.35,'triangle',.16);

  <div class="cta"><h3>${esc(T.cta[0])}</h3><p>${esc(T.cta[1])}</p><p><b>${esc(T.cta[2])}</b></p>
    <div class="acts"><a class="btn white" href="https://fci-awso.github.io/Tager/" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-globe"></i> افتح الديمو المباشر</a></div></div>
  <div class="acts"><button class="btn ghost" id="bk"><i class="fa-solid fa-arrow-right"></i> رجوع للنتيجة</button></div></div>`,true);
  document.getElementById('bk').onclick=()=>{TSFX.close();result()};
}
document.addEventListener('keydown',e=>{
  if(dlg.classList.contains('open')){
    if(e.key==='Escape')dlgDone&&dlgDone(false);
    else if(e.key==='Tab'){const b=[document.getElementById('dlgOk'),document.getElementById('dlgNo')],k=b.indexOf(document.activeElement);e.preventDefault();b[(k+(e.shiftKey?-1:1)+2)%2].focus()}
    return;
  }
  if(!app.querySelector('.opt'))return;
  if(e.key==='1'||e.key==='١')pick(1);else if(e.key==='2'||e.key==='٢')pick(0);
});
document.getElementById('yr').textContent=new Date().getFullYear();
intro();
</script>
